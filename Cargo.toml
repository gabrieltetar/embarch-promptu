[package]
name = "embarch-promptu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Promptu: Claude Code memory organisation (a write-checking hook and an inventory) and, from build step 2, prompt patterns. docs/contract.md is the interface; embarch-doc/embarch-promptu/spec.md is current truth."

[[bin]]
name = "promptu"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Unmaintained since 2024 but complete; the only YAML parser in the offline
# cache. Frontmatter is a few keys, and frontmatter.rs mirrors Claude Code's
# own lenient retry on top of it.
serde_yaml = "0.9.34"
toml = "1.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
